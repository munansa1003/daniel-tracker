# 품질 게이트 CI — 로컬 PostToolUse 훅과 동일한 검사를 원격에서도 강제한다.
# 훅은 각 PC/세션의 편집 시점에만 돈다: CI는 push·PR마다 같은 게이트를
# 깨끗한 환경에서 재실행해, 훅이 없는 경로(직접 push, 다른 기여자)도 막는다.
# 검사 명령은 CLAUDE.md "품질 게이트" 섹션과 일치시킨다(정적 검사 → 테스트).
# 빌드(Vite)는 게이트 범위가 아니므로 quality-gate job에는 넣지 않는다.
name: CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node는 함수 런타임(nodejs22)과 같은 메이저로 맞춘다 — 로컬·CI·런타임이 갈라지면
      # "여기선 되는데 배포하면 안 되는" 종류의 차이가 생긴다(01 §6.3, DR-4).
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 게이트 1단계: 정적 검사 (no-undef 등 크래시성 오류 — 빌드가 못 잡는 것)
      # api 포함 — 서버리스 함수도 같은 no-undef 방어를 받는다(2026-08 감사 R-41)
      - name: Lint (static check)
        run: npx eslint src api --max-warnings=0

      # 게이트 2단계: 전체 테스트 스위트 (골든셋 포함)
      - name: Test
        run: npx vitest run

  # 에뮬레이터 스모크 — 단위 테스트가 못 보는 앞단(Hosting rewrite → 함수 프록시)을 본다.
  # 자격증명이 필요 없다: `demo-` 접두사 프로젝트는 클라우드를 부르지 않는다.
  # 그래서 이 job은 시크릿·변수가 하나도 없는 상태에서도 이 PR에서 바로 돈다.
  #
  # 훅(check.mjs)에는 넣지 않는다 — Java 의존 + 기동 수십 초라 90초 제한 안에서
  # 매 편집마다 돌릴 수 있는 물건이 아니다(01 §11).
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # firebase-tools 15.x의 에뮬레이터는 Java 21 이상을 요구한다.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      # Hosting 에뮬레이터가 서빙할 정적 산출물이 있어야 한다(정적 우선·SPA fallback 검사).
      - name: Build
        run: npm run build

      - name: Emulator smoke (hosting rewrite → functions)
        run: npm run test:emu
